name: Backend CI/CD

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run shared quality gate
        run: npm run ci:quality

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: autobot
          POSTGRES_PASSWORD: autobot
          POSTGRES_DB: autobot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autobot -d autobot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run shared integration gate
        env:
          DATABASE_URL: postgresql://autobot:autobot@localhost:5432/autobot_test?schema=public&connect_timeout=5
        run: npm run ci:integration

  container-validation:
    name: Validate container builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build API from clean checkout
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build migration image from clean checkout
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migration
          push: false
          load: true
          tags: autobot-migration:verify
          cache-from: type=gha,scope=migration
          cache-to: type=gha,mode=max,scope=migration
      - name: Smoke test migration image on a fresh database
        run: |
          docker run -d --name migration-test-db \
            -e POSTGRES_USER=autobot -e POSTGRES_PASSWORD=autobot -e POSTGRES_DB=autobot_test \
            --health-cmd 'pg_isready -U autobot -d autobot_test' \
            --health-interval 1s --health-retries 30 postgres:17-alpine
          trap 'docker rm -f migration-test-db >/dev/null' EXIT
          for attempt in {1..30}; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' migration-test-db)" = healthy ]; then break; fi
            sleep 1
          done
          for attempt in 1 2; do
            docker run --rm --network container:migration-test-db \
              -e DATABASE_URL=postgresql://autobot:autobot@127.0.0.1:5432/autobot_test \
              autobot-migration:verify
          done

  containers:
    name: Build and publish containers
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'
    needs: [quality, integration, container-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      api-image: ${{ steps.images.outputs.api-image }}
      migration-image: ${{ steps.images.outputs.migration-image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set image names
        id: images
        shell: bash
        run: |
          echo "api-image=ghcr.io/dinarsharipov/autobot-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "migration-image=ghcr.io/dinarsharipov/autobot-backend-migration:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ steps.images.outputs.api-image }}
            ghcr.io/dinarsharipov/autobot-backend:dev
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and publish migration image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: migration
          push: true
          tags: |
            ${{ steps.images.outputs.migration-image }}
            ghcr.io/dinarsharipov/autobot-backend-migration:dev
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=migration
          cache-to: type=gha,mode=max,scope=migration

  deploy:
    name: Deploy production
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'
    needs: [containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.API_PUBLIC_URL || 'https://autobot.45.131.135.15.sslip.io' }}
    concurrency:
      group: production-backend
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL || 'https://autobot.45.131.135.15.sslip.io' }}
      EXPECTED_SHA: ${{ github.sha }}
      AUTOBOT_API_IMAGE: ${{ needs.containers.outputs.api-image }}
      AUTOBOT_MIGRATION_IMAGE: ${{ needs.containers.outputs.migration-image }}
      BUILD_SHA: ${{ github.sha }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
      GHCR_USER: ${{ github.repository_owner }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      YOOKASSA_SHOP_ID: ${{ secrets.YOOKASSA_SHOP_ID }}
      YOOKASSA_SECRET_KEY: ${{ secrets.YOOKASSA_SECRET_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0

      - name: Render protected YooKassa environment
        env:
          PRODUCTION_ENV_FILE: ${{ runner.temp }}/autobot-yookassa.env
        run: node scripts/ci/render-yookassa-env.mjs "$PRODUCTION_ENV_FILE"

      - name: Deploy backend containers
        env:
          PRODUCTION_ENV_FILE: ${{ runner.temp }}/autobot-yookassa.env
        run: bash scripts/ci/deploy-over-ssh.sh

      - name: Wait for server pull deployment
        shell: bash
        run: |
          for _ in {1..60}; do
            response="$(curl --fail --silent --show-error \
              "$API_PUBLIC_URL/api/v1/health/ready" || true)"
            if grep --fixed-strings --quiet "\"version\":\"$EXPECTED_SHA\"" <<<"$response"; then
              exit 0
            fi
            sleep 10
          done
          echo "Production did not report build $EXPECTED_SHA within 10 minutes" >&2
          exit 1

      - name: Verify published OpenAPI
        run: |
          curl --fail --silent --show-error \
            "$API_PUBLIC_URL/api/docs-json" \
            | grep --fixed-strings --quiet '"title":"Autobot Backend API"'
